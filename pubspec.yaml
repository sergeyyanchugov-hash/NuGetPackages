name: nuget_packages
description: A new Flutter project translating DotNetPackages.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^18.1.2
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
